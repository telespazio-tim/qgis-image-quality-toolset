# TEMPORARY: find which conda-forge package breaks `import qgis.core` on Windows with QGIS 3. Delete after use.
name: tmp-win-qgis3
on:
  push:
    paths: [".github/workflows/tmp-win-qgis3.yml"]
jobs:
  probe:
    name: probe (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base, pins: ""}
          - {name: protobuf, pins: "libprotobuf=7.35.1=*_3"}
          - {name: abseil, pins: "libabseil=20260526.0"}
          - {name: libpq, pins: "libpq=18.6=*_3 postgresql=18.6=*_3"}
          - {name: snappy, pins: "snappy=1.2.2"}
          - {name: vcruntime, pins: "vc14_runtime=14.51.36247=*_42 vs2015_runtime=14.51.36247=*_42 vc=14.5=*_42"}
          - {name: grpc-stack, pins: "libgrpc=1.82.2 libprotobuf=7.35.1=*_3 libabseil=20260526.0 libre2-11=2025.11.05=*_2"}
          - {name: mega, pins: "libgdal-core=3.13.3=*_5 libprotobuf=7.35.1=*_3 libabseil=20260526.0 libgrpc=1.82.2 libarrow=25.0.1=*_3_cpu snappy=1.2.2 c-blosc2=3.3.5 libthrift=0.25.0=*_1 libnetcdf=4.10.1=nompi_*_202 tiledb=2.30.1=*_24 libpq=18.6=*_3 postgresql=18.6=*_3 libevent=2.1.12"}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: mtf
      - name: Install
        env:
          PINS: ${{ matrix.pins }}
        run: |
          set -f
          conda install -y "qgis=3.*" numpy scipy matplotlib scikit-image pip $PINS
      - name: import qgis.core
        run: |
          export PYTHONPATH="$CONDA_PREFIX\\Library\\python;$CONDA_PREFIX\\Library\\python\\plugins"
          python -c "from qgis.core import QgsApplication; print('IMPORT OK')"
