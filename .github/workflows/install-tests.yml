name: install-tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  install:
    name: install (${{ matrix.os }}, qgis${{ matrix.qgis }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-latest, macos-14, macos-15, macos-15-intel, macos-26]  # linux / win64 / osx (arm64 + intel)
        qgis: ["3", "4"]  # one plugin zip per platform and QGIS major version
        include:
          # runners that publish a zip (macos-14 = oldest arm64, widest wheel compatibility)
          - {os: ubuntu-22.04, platform: linux-x64, package: true}  # oldest LTS = lowest glibc
          - {os: windows-latest, platform: win-x64, package: true}
          - {os: macos-14, platform: macos-arm64, package: true}
          - {os: macos-15-intel, platform: macos-x64, package: true}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Show OS version
        run: uname -a; if [ "$RUNNER_OS" = macOS ]; then sw_vers; fi
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: mtf
      - name: Install QGIS and dependencies
        run: |
          conda install -y "qgis=${{ matrix.qgis }}.*" numpy scipy matplotlib scikit-image pip
          pip install loess==2.1.2
      - name: Install plugin, smoke test and run algorithms
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # conda-forge qgis on Windows keeps its Python bindings under Library/
          if [ "$RUNNER_OS" = Windows ]; then
            export PYTHONPATH="$CONDA_PREFIX\\Library\\python;$CONDA_PREFIX\\Library\\python\\plugins"
            export QGIS_PREFIX_PATH="$CONDA_PREFIX\\Library"
          fi
          python test/test_install.py
          python test/test_algorithms.py
      # numpy/scipy/matplotlib (and its dependencies) come from QGIS; loess and scikit-image (compiled, so tied to
      # platform and Python version) are bundled where the plugin looks: <plugin>/dependencies
      - name: Build plugin zip
        if: matrix.package
        run: |
          # no make/rsync on the Windows runner
          mkdir build && cp -r image_quality_toolset build/
          find build -name __pycache__ -prune -exec rm -rf {} +
          D=build/image_quality_toolset/dependencies
          pip install --target "$D" loess==2.1.2 scikit-image
          (cd "$D" && rm -rf bin numpy* scipy* matplotlib* mpl_toolkits pylab.py contourpy* cycler* kiwisolver* fontTools fonttools* dateutil python_dateutil* pyparsing* six.py)
          V=$(grep '^version=' image_quality_toolset/metadata.txt | cut -d= -f2)
          mkdir -p out
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', 'build', 'image_quality_toolset')" \
            "out/image_quality_toolset-$V-${{ matrix.platform }}-qgis${{ matrix.qgis }}"
      # Install from the zip as a user would: remove the dependencies from the environment so only
      # the zip can provide them, forbid pip downloads, then start the plugin and run the algorithms.
      - name: Test the plugin zip
        if: matrix.package
        env:
          QT_QPA_PLATFORM: offscreen
          PIP_NO_INDEX: "1"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PYTHONPATH="$CONDA_PREFIX\\Library\\python;$CONDA_PREFIX\\Library\\python\\plugins"
            export QGIS_PREFIX_PATH="$CONDA_PREFIX\\Library"
          fi
          pip uninstall -y loess scikit-image imageio tifffile lazy_loader networkx
          if python -c "import loess" 2>/dev/null; then echo "loess still in the environment" >&2; exit 1; fi
          mkdir unzipped
          python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('out/*.zip')[0]).extractall('unzipped')"
          export IQT_PLUGIN_PARENT="$PWD/unzipped"
          python test/test_install.py
          python test/test_gui.py
          python test/test_algorithms.py
      - uses: actions/upload-artifact@v4
        if: matrix.package
        with:
          name: plugin-${{ matrix.platform }}-qgis${{ matrix.qgis }}
          path: out/*.zip

  # Official QGIS .dmg (the bundle end users install), as opposed to conda-forge above.
  # The bundle needs a recent macOS, so failures on macos-14 are expected to show the
  # "built for Mac OS X 15.0" libc++ error. Not blocking: bundle paths may need tuning.
  dmg:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
        channel: [ltr, pr]   # https://qgis.org/downloads/macos/qgis-macos-<channel>.dmg
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Show OS version
        run: sw_vers
      - name: Install official QGIS dmg
        run: |
          curl -fL -o qgis.dmg "https://qgis.org/downloads/macos/qgis-macos-${{ matrix.channel }}.dmg"
          MNT=$(hdiutil attach qgis.dmg -nobrowse | grep -o '/Volumes/.*' | head -1)
          ls "$MNT"
          cp -R "$MNT"/QGIS*.app /Applications/
          ls -d /Applications/QGIS*.app
      - name: Install extra dependencies in the bundle Python
        run: |
          APP=$(ls -d /Applications/QGIS*.app | head -1)
          # The interpreter moved across QGIS releases: recent bundles ship
          # Contents/MacOS/python (a wrapper that sets PYTHONHOME), older ones
          # used Contents/MacOS/bin/python3 or Contents/Frameworks/bin/python3.
          # See https://github.com/qgis/QGIS/issues/62927
          PY=""
          for cand in "$APP/Contents/MacOS/python" "$APP/Contents/MacOS/bin/python3" "$APP/Contents/Frameworks/bin/python3"; do
            if [ -x "$cand" ]; then PY="$cand"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "No Python interpreter found under $APP/Contents; candidates were:" >&2
            find "$APP/Contents" -maxdepth 3 \( -name 'python3*' -o -name python \) >&2
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"; echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" --version
          "$PY" -m pip install --target "$RUNNER_TEMP/extra" loess==2.1.2 scikit-image
      - name: Install plugin and run tests with the bundle Python
        run: |
          # QGIS 4 installs its data (including the processing plugin) under
          # Contents/Resources/qgis, and the bundle prefix is the .app root
          # itself -- not Contents/MacOS. The python bindings live in the
          # Frameworks site-packages and are already picked up by $PY
          # (Contents/MacOS/python). See QgsApplication/QGIS_MAC_BUNDLE.
          export PYTHONPATH="$APP/Contents/Resources/qgis/python/plugins:$APP/Contents/Resources/python/plugins:$RUNNER_TEMP/extra"
          export QGIS_PREFIX_PATH="$APP"
          "$PY" test/test_install.py
          "$PY" test/test_algorithms.py

  # Dependency-free zip (the plugin installs its dependencies itself at first run).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: image_quality_toolset-plugin
          path: dist/*.zip
